# =============================================================================
# Kubeshark - API Traffic Analyzer (ON-DEMAND)
# =============================================================================
# Real-time visibility into Kubernetes API traffic.
# Like Wireshark, but for microservices communication.
#
# Features:
#   - Protocol decoding (HTTP, gRPC, GraphQL, Kafka, Redis)
#   - Real-time traffic capture
#   - Service dependency visualization
#   - Traffic replay for debugging
#
# ⚠️ ON-DEMAND DEPLOYMENT:
#   This tool is deployed with replicas=0 by default to save memory on
#   resource-constrained Raspberry Pi nodes. Scale up only when debugging.
#
# Enable Kubeshark:
#   kubectl scale deployment kubeshark-hub -n observability --replicas=1
#   kubectl scale daemonset kubeshark-worker -n observability --replicas=1
#
# Disable Kubeshark (after debugging):
#   kubectl scale deployment kubeshark-hub -n observability --replicas=0
#   kubectl delete daemonset kubeshark-worker -n observability
#
# Access (when enabled): Port-forward to Kubeshark UI
#   kubectl port-forward -n observability svc/kubeshark-hub 8899:80
#   Open: http://localhost:8899
#
# WARNING: High memory usage during capture (~512MB+). Disable when not debugging.
#
# Dependencies: Longhorn (for persistent storage)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kubeshark
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://helm.kubeshark.co
    chart: kubeshark
    targetRevision: 52.3.0
    helm:
      values: |
        # -------------------------------------------------------------------
        # ON-DEMAND: Scale to Zero by Default
        # -------------------------------------------------------------------
        # Kubeshark uses significant memory. Deploy with 0 replicas and
        # scale up only when actively debugging API traffic.
        #
        # Enable:  kubectl scale deployment kubeshark-hub -n observability --replicas=1
        # Disable: kubectl scale deployment kubeshark-hub -n observability --replicas=0
        # -------------------------------------------------------------------
        hub:
          replicas: 0
        
        # -------------------------------------------------------------------
        # Traffic Capture Settings
        # -------------------------------------------------------------------
        tap:
          # Persistent storage for captured traffic
          persistentStorage: true
          storageClass: longhorn
          storageSize: 5Gi
          
          # Resource limits (RPi optimized)
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        
        # -------------------------------------------------------------------
        # Hub (UI Server)
        # -------------------------------------------------------------------
        hub:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
  
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
