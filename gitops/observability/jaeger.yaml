# =============================================================================
# Jaeger - Distributed Tracing Backend (ON-DEMAND)
# =============================================================================
# Provides trace storage, query engine, and web UI for visualizing
# request flows across microservices.
#
# Configuration (RPi optimized):
#   - All-in-One deployment (collector + query + agent in one pod)
#   - In-memory storage (no external DB required)
#   - Max 1000 traces to prevent OOM
#
# ⚠️ ON-DEMAND DEPLOYMENT:
#   This tool is deployed with replicas=0 by default to save memory on
#   resource-constrained Raspberry Pi nodes. Scale up only when debugging.
#
# Enable Jaeger:
#   kubectl scale deployment jaeger-all-in-one -n monitoring --replicas=1
#
# Disable Jaeger (after debugging):
#   kubectl scale deployment jaeger-all-in-one -n monitoring --replicas=0
#
# Features:
#   - Service dependency graph
#   - Trace comparison
#   - Latency histograms
#   - Error tracking
#
# Access (when enabled): http://jaeger.192.168.68.210.nip.io
#
# Dependencies: OpenTelemetry Operator (for auto-instrumentation)
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: jaeger
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/resources-finalizer
spec:
  project: default
  source:
    repoURL: https://jaegertracing.github.io/helm-charts
    chart: jaeger
    targetRevision: 3.0.0
    helm:
      values: |
        # -------------------------------------------------------------------
        # ON-DEMAND: Scale to Zero by Default
        # -------------------------------------------------------------------
        # Jaeger uses ~512MB memory. Deploy with 0 replicas and scale up
        # only when actively debugging distributed traces.
        #
        # Enable:  kubectl scale deployment jaeger-all-in-one -n monitoring --replicas=1
        # Disable: kubectl scale deployment jaeger-all-in-one -n monitoring --replicas=0
        # -------------------------------------------------------------------
        allInOne:
          enabled: true
          replicas: 0
          # Limit in-memory traces to prevent OOM
          args:
            - "--memory.max-traces=1000"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
        
        # -------------------------------------------------------------------
        # Disable External Data Stores (use in-memory)
        # -------------------------------------------------------------------
        provisionDataStore:
          cassandra: false
          elasticsearch: false
          kafka: false
        
        # -------------------------------------------------------------------
        # Storage Configuration
        # -------------------------------------------------------------------
        storage:
          type: memory
        
        # -------------------------------------------------------------------
        # Disable Legacy Ingress (we use Gateway API HTTPRoute)
        # -------------------------------------------------------------------
        query:
          ingress:
            enabled: false
  
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
# =============================================================================
# HTTPRoute for Jaeger UI (Gateway API)
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger-query
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "jaeger.192.168.68.210.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger-query
          port: 16686
