apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: signoz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.signoz.io
    chart: signoz
    targetRevision: 0.36.0
    helm:
      values: |
        global:
          storageClass: longhorn
        
        # Limit ClickHouse resource usage
        clickhouse:
          resources:
            limits:
              memory: 1Gi
              cpu: 1000m
            requests:
              memory: 512Mi
              cpu: 500m
        
        queryService:
          resources:
            limits:
              memory: 512Mi
        
        frontend:
          ingress:
            enabled: true
            className: traefik
            hosts:
              - host: signoz.192.168.68.210.nip.io
                paths:
                  - path: /
                    pathType: Prefix
  destination:
    server: https://kubernetes.default.svc
    namespace: signoz
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
