# ============================================================================
# TRIVY OPERATOR - Continuous Security Scanning
# ============================================================================
# Component: Trivy Operator v0.19.1
# Purpose: Continuously scans cluster for vulnerabilities, misconfigurations,
#          and exposed secrets. Generates Kubernetes CRD reports.
# Dependencies: Prometheus (optional, for metrics)
# ============================================================================
#
# REPORT TYPES GENERATED:
#   - VulnerabilityReport: Image CVE scanning (per container)
#   - ConfigAuditReport: K8s misconfigurations (per workload)
#   - ExposedSecretReport: Secrets leaked in container images
#   - RbacAssessmentReport: RBAC permission analysis
#   - InfraAssessmentReport: Node-level security issues
#
# SCAN TRIGGERS:
#   - New workload created
#   - Image tag updated
#   - Scheduled rescan (configurable, default 24h)
#
# USEFUL COMMANDS:
#   # List all vulnerability reports
#   kubectl get vulnerabilityreports -A
#
#   # Find critical vulnerabilities
#   kubectl get vulnerabilityreports -A -o json | \
#     jq -r '.items[] | select(.report.summary.criticalCount > 0) | 
#       "\(.metadata.namespace)/\(.metadata.name)"'
#
#   # Get config audit failures
#   kubectl get configauditreports -A
#
#   # Check for exposed secrets
#   kubectl get exposedsecretreports -A
#
# PROMETHEUS METRICS:
#   - trivy_image_vulnerabilities{severity="Critical|High|Medium|Low"}
#   - trivy_configauditreport_danger_count
#   - trivy_exposedsecretreport_secret_count
#
# RESOURCE USAGE (ARM64):
#   - Operator: ~100MB
#   - Scan Jobs: ~200MB (ephemeral, per scan)
#
# ============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: trivy-operator
  namespace: argocd
  labels:
    app.kubernetes.io/component: security-scanner
    app.kubernetes.io/part-of: security-platform
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: default
  source:
    repoURL: https://aquasecurity.github.io/helm-charts/
    chart: trivy-operator
    targetRevision: 0.19.1
    helm:
      values: |
        # ──────────────────────────────────────────────────────────────────────
        # TRIVY SCANNER CONFIGURATION
        # ──────────────────────────────────────────────────────────────────────
        trivy:
          # Only report vulnerabilities with available fixes
          # Reduces noise from unfixable CVEs
          ignoreUnfixed: true
          
          # Severity levels to report
          # Options: UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          
          # Skip scanning system directories
          skipDirs: "/proc,/sys,/dev"
          
          # Resource limits for scan jobs
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 500m
              memory: 500Mi
          
          # Vulnerability database settings
          dbRepository: ghcr.io/aquasecurity/trivy-db
          dbRepositoryInsecure: false

        # ──────────────────────────────────────────────────────────────────────
        # OPERATOR CONFIGURATION
        # ──────────────────────────────────────────────────────────────────────
        operator:
          # Scan only current revision pods (ignore old ReplicaSets)
          vulnerabilityScannerScanOnlyCurrentRevisions: true
          
          # Resource limits for operator
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 256Mi

        # ──────────────────────────────────────────────────────────────────────
        # SCAN CONFIGURATION
        # ──────────────────────────────────────────────────────────────────────
        scanJob:
          # Vulnerability scanning (CVEs in images)
          vulnerabilityReports:
            scanner: Trivy
          
          # Configuration auditing (K8s best practices)
          configAuditReports:
            scanner: Trivy
          
          # Exposed secrets detection
          exposedSecretReports:
            scanner: Trivy
          
          # RBAC assessment
          rbacAssessmentReports:
            scanner: Trivy

        # ──────────────────────────────────────────────────────────────────────
        # PROMETHEUS INTEGRATION
        # ──────────────────────────────────────────────────────────────────────
        serviceMonitor:
          # Enable ServiceMonitor for Prometheus scraping
          enabled: true
          interval: 60s
          labels:
            release: prometheus
        
        # Expose vulnerability IDs in metrics
        trivyOperator:
          metricsVulnerabilityId:
            enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: trivy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
