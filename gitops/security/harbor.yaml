apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io/resources-finalizer
spec:
  project: default
  # Ignore volumeClaimTemplates differences (apiVersion/kind fields are auto-added by K8s)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  source:
    repoURL: https://helm.goharbor.io
    chart: harbor
    targetRevision: 1.15.0
    helm:
      values: |
        # -------------------------------------------------------------------
        # Expose Configuration (Disabled - Using Gateway API HTTPRoute)
        # -------------------------------------------------------------------
        expose:
          type: clusterIP
          tls:
            enabled: false
        
        externalURL: http://harbor.192.168.68.210.nip.io
        
        # Point to our local MinIO
        persistence:
          imageChartStorage:
            type: s3
            s3:
              region: us-east-1
              bucket: harbor
              endpoint: http://minio.storage.svc.cluster.local:9000
              accesskey: admin
              secretkey: password123
              storageclass: STANDARD

        # Disable Notary/ChartMuseum to save RAM on Pis
        notary:
          enabled: false
        chartmuseum:
          enabled: false
        
        # Keep Trivy for security scanning
        trivy:
          enabled: true
        
        # -------------------------------------------------------------------
        # Redis Cache - Use local-path for faster I/O
        # -------------------------------------------------------------------
        # Redis is used for caching and session storage. Using local-path
        # provides better performance than network storage (Longhorn).
        redis:
          internal:
            enabled: true
          external:
            enabled: false
        
        persistence:
          persistentVolumeClaim:
            redis:
              storageClass: local-path
              size: 1Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# =============================================================================
# HTTPRoute for Harbor Registry (Gateway API)
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: harbor
  namespace: harbor
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "harbor.192.168.68.210.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: harbor-core
          port: 80
