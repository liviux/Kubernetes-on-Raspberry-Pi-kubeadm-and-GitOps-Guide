# =============================================================================
# Gitea - Self-Hosted Git Server
# =============================================================================
# Provides the Git repository hosting for the GitOps workflow. All cluster
# configuration lives here as code, making it the "single source of truth".
#
# Features:
#   - PostgreSQL database for production reliability
#   - Longhorn storage for persistent data
#   - SSH and HTTP access for git operations
#   - Modern UI with auto theme detection
#
# Access:
#   - Web: http://gitea.192.168.68.210.nip.io
#   - SSH: ssh://git@192.168.68.211:2222/user/repo.git (separate IP from Traefik)
#
# First-time Setup:
#   1. Access web UI
#   2. Create admin account
#   3. Create 'home-cluster' repository
#   4. Push gitops/ folder content
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io/resources-finalizer
spec:
  project: default
  # Ignore volumeClaimTemplates differences (apiVersion/kind fields are auto-added by K8s)
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      jqPathExpressions:
        - .spec.volumeClaimTemplates[]?.apiVersion
        - .spec.volumeClaimTemplates[]?.kind
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.4.0
    helm:
      values: |
        # -------------------------------------------------------------------
        # Global Configuration
        # -------------------------------------------------------------------
        # NOTE: We do NOT set global.storageClass here because it would
        # override ALL subcharts (including valkey-cluster). Instead, we
        # set storageClass explicitly for each component.
        
        # -------------------------------------------------------------------
        # Gitea Application Settings
        # -------------------------------------------------------------------
        gitea:
          admin:
            existingSecret: ""  # Create admin on first login via UI
          
          config:
            APP_NAME: "PiCluster Git"
            
            server:
              DOMAIN: "gitea.192.168.68.210.nip.io"
              ROOT_URL: "http://gitea.192.168.68.210.nip.io/"
              SSH_DOMAIN: "192.168.68.211"
              SSH_PORT: "2222"
            
            ui:
              DEFAULT_THEME: "gitea-auto"
            
            service:
              DISABLE_REGISTRATION: false  # Enable for first setup
            
            repository:
              DEFAULT_BRANCH: "main"
          
          # Resource limits for RPi
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 1000m
        
        # -------------------------------------------------------------------
        # Persistent Storage
        # -------------------------------------------------------------------
        persistence:
          enabled: true
          size: 10Gi
          storageClass: longhorn
        
        # -------------------------------------------------------------------
        # PostgreSQL Database - Use Longhorn for durability
        # -------------------------------------------------------------------
        postgresql:
          enabled: true
          global:
            storageClass: longhorn
          primary:
            persistence:
              storageClass: longhorn
              size: 5Gi
            resources:
              requests:
                memory: 128Mi
                cpu: 50m
              limits:
                memory: 256Mi
                cpu: 250m
        
        postgresql-ha:
          enabled: false
        
        # -------------------------------------------------------------------
        # Valkey (Redis-compatible cache) - Use local-path for faster I/O
        # -------------------------------------------------------------------
        # Valkey handles its own replication across cluster nodes, so we use
        # local-path for better I/O performance instead of network storage.
        # The global.storageClass in valkey-cluster overrides persistence.storageClass
        valkey-cluster:
          enabled: true
          global:
            storageClass: local-path
          persistence:
            enabled: true
            storageClass: local-path
            size: 2Gi
        
        # -------------------------------------------------------------------
        # Ingress Configuration (Disabled - Using Gateway API HTTPRoute)
        # -------------------------------------------------------------------
        ingress:
          enabled: false
        
        # -------------------------------------------------------------------
        # Service Configuration
        # -------------------------------------------------------------------
        # Note: SSH uses a separate IP (192.168.68.211) because Traefik
        # already uses .210 for HTTP/HTTPS traffic.
        service:
          http:
            type: ClusterIP
            port: 3000
          ssh:
            type: LoadBalancer
            port: 2222
            annotations:
              io.cilium/lb-ipam-ips: "192.168.68.211"
  
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true