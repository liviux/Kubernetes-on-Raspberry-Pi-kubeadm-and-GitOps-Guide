# =============================================================================
# MinIO - S3-Compatible Object Storage
# =============================================================================
# Provides S3 API for Cloud Native tools that expect object storage.
# This is the foundation for backup, logging, and metrics storage.
#
# Buckets Created:
#   - velero: Cluster backups
#   - harbor: Container image layers
#   - loki-data: Log storage
#   - thanos-data: Long-term metrics
#
# Access:
#   - Console: http://minio.192.168.68.210.nip.io
#   - API: http://minio.storage.svc.cluster.local:9000
#   - Credentials: admin / password123 (CHANGE IN PRODUCTION!)
#
# Dependencies: Longhorn storage class
# =============================================================================

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: minio
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    argocd.argoproj.io/sync-options: ServerSideApply=true
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.min.io/
    chart: minio
    targetRevision: 5.2.0
    helm:
      values: |
        # -------------------------------------------------------------------
        # Deployment Mode
        # -------------------------------------------------------------------
        mode: standalone
        replicas: 1
        
        # -------------------------------------------------------------------
        # Storage Configuration
        # -------------------------------------------------------------------
        persistence:
          enabled: true
          storageClass: longhorn
          size: 50Gi
          accessMode: ReadWriteOnce
        
        # -------------------------------------------------------------------
        # Resource Limits (RPi optimized)
        # -------------------------------------------------------------------
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        
        # -------------------------------------------------------------------
        # Auto-Create Buckets
        # -------------------------------------------------------------------
        buckets:
          - name: velero
            policy: none
            purge: false
          - name: harbor
            policy: none
            purge: false
          - name: loki-data
            policy: none
            purge: false
          - name: thanos-data
            policy: none
            purge: false
        
        # -------------------------------------------------------------------
        # Ingress Configuration (Disabled - Using Gateway API HTTPRoute)
        # -------------------------------------------------------------------
        ingress:
          enabled: false
        
        consoleIngress:
          enabled: false
        
        # -------------------------------------------------------------------
        # Credentials (CHANGE IN PRODUCTION!)
        # -------------------------------------------------------------------
        rootUser: admin
        rootPassword: password123
  
  destination:
    server: https://kubernetes.default.svc
    namespace: storage
  
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
---
# =============================================================================
# HTTPRoute for MinIO API (Gateway API)
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-api
  namespace: storage
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "minio.192.168.68.210.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio
          port: 9000
---
# =============================================================================
# HTTPRoute for MinIO Console (Gateway API)
# =============================================================================
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio-console
  namespace: storage
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "minio-console.192.168.68.210.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio-console
          port: 9001