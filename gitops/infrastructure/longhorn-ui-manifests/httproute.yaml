# =============================================================================
# Longhorn UI HTTPRoute (Gateway API)
# =============================================================================
# Routes HTTP traffic to Longhorn UI via the shared Traefik Gateway.
# Provides persistent browser access to Longhorn storage management.
#
# Access URL: http://longhorn.192.168.68.210.nip.io
# =============================================================================

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik-system
  hostnames:
    - "longhorn.192.168.68.210.nip.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: longhorn-frontend
          port: 80
