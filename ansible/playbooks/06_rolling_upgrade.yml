---
# ============================================================================
# ROLLING OS UPGRADE PLAYBOOK
# ============================================================================
# Description: Safe rolling OS updates across the cluster with zero downtime
# Use Case:    Security patches, kernel updates, package upgrades
#
# How It Works:
#   1. Drains workloads from the target node
#   2. Runs apt update && apt upgrade
#   3. Reboots if a kernel update requires it
#   4. Waits for the node to rejoin the cluster
#   5. Uncordons the node to accept workloads again
#   6. Proceeds to the next node (serial execution)
#
# Safety Features:
#   - Serial execution (one node at a time)
#   - Automatic drain with timeout
#   - Graceful pod eviction
#   - Health checks before proceeding
#   - Control plane upgraded last (default)
#
# Usage:
#   # Upgrade all nodes (workers first, control plane last)
#   ansible-playbook -i hosts playbooks/06_rolling_upgrade.yml
#
#   # Upgrade specific node only
#   ansible-playbook -i hosts playbooks/06_rolling_upgrade.yml --limit rpi4-2
#
#   # Dry-run (check what would be upgraded)
#   ansible-playbook -i hosts playbooks/06_rolling_upgrade.yml --check
#
#   # Skip reboot even if kernel updated
#   ansible-playbook -i hosts playbooks/06_rolling_upgrade.yml -e "allow_reboot=false"
#
# Pre-requisites:
#   - kubectl configured on control node (or local machine)
#   - Cluster healthy (all nodes Ready)
#   - Sufficient capacity to handle drained workloads
#
# Author: Kubernetes on Raspberry Pi Guide
# ============================================================================

# =============================================================================
# PHASE 1: Upgrade Worker Nodes (one at a time)
# =============================================================================
- name: Rolling OS Upgrade - Worker Nodes
  hosts: small
  become: true
  serial: 1  # One node at a time for zero downtime
  
  vars:
    # Allow reboot if kernel was updated
    allow_reboot: true
    # Timeout for drain operation (seconds)
    drain_timeout: 300
    # Timeout for node to become Ready after reboot (seconds)
    ready_timeout: 300
    # Grace period for pod eviction (seconds)
    eviction_grace_period: 30

  tasks:
    # =========================================================================
    # PRE-UPGRADE: Health Check
    # =========================================================================
    - name: Display Upgrade Banner
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║             🔄 ROLLING OS UPGRADE - {{ inventory_hostname }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║  Starting upgrade process for node: {{ inventory_hostname }}
          ║  Allow Reboot: {{ allow_reboot }}
          ╚══════════════════════════════════════════════════════════════════════╝

    - name: Check if node is part of cluster
      ansible.builtin.command: kubectl get node {{ inventory_hostname }}
      delegate_to: "{{ groups['big'][0] }}"
      register: node_check
      changed_when: false
      failed_when: node_check.rc != 0

    # =========================================================================
    # DRAIN: Move workloads off this node
    # =========================================================================
    - name: Drain node (evict pods gracefully)
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --grace-period={{ eviction_grace_period }}
        --timeout={{ drain_timeout }}s
        --force
      delegate_to: "{{ groups['big'][0] }}"
      register: drain_result
      changed_when: "'drained' in drain_result.stdout or drain_result.rc == 0"

    - name: Report drain status
      ansible.builtin.debug:
        msg: "✓ Node {{ inventory_hostname }} drained successfully"

    # =========================================================================
    # UPGRADE: Apply OS updates
    # =========================================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Get list of upgradable packages
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display packages to upgrade
      ansible.builtin.debug:
        msg: |
          Packages to upgrade on {{ inventory_hostname }}:
          {{ upgradable_packages.stdout }}
      when: upgradable_packages.stdout != "Listing..."

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: safe
        autoremove: yes
        autoclean: yes
      register: upgrade_result

    - name: Report upgrade status
      ansible.builtin.debug:
        msg: "✓ Package upgrade completed"

    # =========================================================================
    # REBOOT: If kernel was updated
    # =========================================================================
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ 'Reboot required - kernel was updated' if reboot_required.stat.exists else 'No reboot required' }}"

    - name: Reboot node if required
      ansible.builtin.reboot:
        msg: "Rebooting for kernel update"
        reboot_timeout: 300
        post_reboot_delay: 30
      when:
        - reboot_required.stat.exists
        - allow_reboot | bool

    # =========================================================================
    # POST-UPGRADE: Verify and uncordon
    # =========================================================================
    - name: Wait for node to become Ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }}
        --timeout={{ ready_timeout }}s
      delegate_to: "{{ groups['big'][0] }}"
      register: ready_result
      retries: 3
      delay: 10
      until: ready_result.rc == 0

    - name: Uncordon node (allow scheduling)
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      delegate_to: "{{ groups['big'][0] }}"
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout or uncordon_result.rc == 0"

    - name: Verify node is schedulable
      ansible.builtin.command: >
        kubectl get node {{ inventory_hostname }}
        -o jsonpath='{.spec.unschedulable}'
      delegate_to: "{{ groups['big'][0] }}"
      register: schedulable_check
      changed_when: false
      failed_when: schedulable_check.stdout == 'true'

    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║             ✅ NODE UPGRADE COMPLETE - {{ inventory_hostname }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║  Upgraded: {{ 'Yes' if upgrade_result.changed else 'Already up-to-date' }}
          ║  Rebooted: {{ 'Yes' if (reboot_required.stat.exists and allow_reboot) else 'No' }}
          ║  Status:   Ready and Schedulable
          ╚══════════════════════════════════════════════════════════════════════╝

# =============================================================================
# PHASE 2: Upgrade Control Plane Node (last)
# =============================================================================
- name: Rolling OS Upgrade - Control Plane
  hosts: big
  become: true
  serial: 1
  
  vars:
    allow_reboot: true
    drain_timeout: 300
    ready_timeout: 300
    eviction_grace_period: 30

  tasks:
    # =========================================================================
    # PRE-UPGRADE: Safety Check
    # =========================================================================
    - name: Display Control Plane Upgrade Banner
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║          🎛️  CONTROL PLANE UPGRADE - {{ inventory_hostname }}
          ╠══════════════════════════════════════════════════════════════════════╣
          ║  ⚠️  WARNING: Upgrading control plane node
          ║  The Kubernetes API will be briefly unavailable during reboot.
          ╚══════════════════════════════════════════════════════════════════════╝

    - name: Verify all worker nodes are Ready
      ansible.builtin.shell: |
        kubectl get nodes --no-headers | grep -v {{ inventory_hostname }} | grep -v Ready && exit 1 || exit 0
      register: workers_ready
      changed_when: false
      failed_when: workers_ready.rc != 0

    # =========================================================================
    # DRAIN: Control plane (skip system pods)
    # =========================================================================
    - name: Drain control plane node
      ansible.builtin.command: >
        kubectl drain {{ inventory_hostname }}
        --ignore-daemonsets
        --delete-emptydir-data
        --grace-period={{ eviction_grace_period }}
        --timeout={{ drain_timeout }}s
        --force
      register: drain_result
      changed_when: "'drained' in drain_result.stdout or drain_result.rc == 0"

    # =========================================================================
    # UPGRADE: Apply OS updates
    # =========================================================================
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: yes
        cache_valid_time: 0

    - name: Get list of upgradable packages
      ansible.builtin.command: apt list --upgradable
      register: upgradable_packages
      changed_when: false

    - name: Display packages to upgrade
      ansible.builtin.debug:
        msg: |
          Packages to upgrade on {{ inventory_hostname }}:
          {{ upgradable_packages.stdout }}
      when: upgradable_packages.stdout != "Listing..."

    - name: Upgrade all packages
      ansible.builtin.apt:
        upgrade: safe
        autoremove: yes
        autoclean: yes
      register: upgrade_result

    # =========================================================================
    # REBOOT: If kernel was updated
    # =========================================================================
    - name: Check if reboot is required
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Display reboot status
      ansible.builtin.debug:
        msg: "{{ 'Reboot required - kernel was updated' if reboot_required.stat.exists else 'No reboot required' }}"

    - name: Reboot control plane if required
      ansible.builtin.reboot:
        msg: "Rebooting control plane for kernel update"
        reboot_timeout: 300
        post_reboot_delay: 60
      when:
        - reboot_required.stat.exists
        - allow_reboot | bool

    # =========================================================================
    # POST-UPGRADE: Verify cluster health
    # =========================================================================
    - name: Wait for API server to be available
      ansible.builtin.command: kubectl cluster-info
      register: cluster_info
      retries: 30
      delay: 10
      until: cluster_info.rc == 0
      changed_when: false

    - name: Wait for control plane node to become Ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready
        node/{{ inventory_hostname }}
        --timeout={{ ready_timeout }}s
      register: ready_result
      retries: 3
      delay: 10
      until: ready_result.rc == 0

    - name: Uncordon control plane node
      ansible.builtin.command: kubectl uncordon {{ inventory_hostname }}
      register: uncordon_result
      changed_when: "'uncordoned' in uncordon_result.stdout or uncordon_result.rc == 0"

    - name: Verify all nodes are Ready
      ansible.builtin.command: kubectl get nodes
      register: final_node_status
      changed_when: false

    - name: Display final cluster status
      ansible.builtin.debug:
        msg: |
          ╔══════════════════════════════════════════════════════════════════════╗
          ║             ✅ ROLLING UPGRADE COMPLETE                              ║
          ╠══════════════════════════════════════════════════════════════════════╣
          {{ final_node_status.stdout | indent(10) }}
          ╚══════════════════════════════════════════════════════════════════════╝
