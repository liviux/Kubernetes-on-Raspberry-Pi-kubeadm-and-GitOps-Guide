---
- name: Phase 1 - OS Preparation & Tuning
  hosts: all
  become: true
  vars:
    gpu_mem: 16
  tasks:
    # --- SYSTEM UPDATES & DEPENDENCIES ---
    - name: Update apt cache and upgrade packages
      apt:
        update_cache: yes
        upgrade: dist
      register: apt_action
      retries: 5
      delay: 10

    - name: Install Essential Dependencies
      apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - open-iscsi  # Critical for Longhorn
          - nfs-common  # Critical for RWX volumes
          - ipset       # Critical for Cilium
          - jq
        state: present

    - name: Disable Swap (Runtime)
      command: swapoff -a
      when: ansible_swaptionals['type'] is defined

    - name: Disable Swap (Permanent)
      replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+sw\s+.*)$'
        replace: '# \1'

    # --- KERNEL & NETWORK TUNING ---
    - name: Load Kernel Modules
      blockinfile:
        path: /etc/modules-load.d/k8s.conf
        create: yes
        block: |
          overlay
          br_netfilter

    - name: Load modules immediately
      shell: |
        modprobe overlay
        modprobe br_netfilter

    - name: Configure Sysctl
      blockinfile:
        path: /etc/sysctl.d/k8s.conf
        create: yes
        block: |
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1

    - name: Apply Sysctl params
      command: sysctl --system

    # --- RASPBERRY PI SPECIFIC ---
    - name: Enable Cgroups in cmdline.txt
      shell: |
        cmdline=$(cat /boot/firmware/cmdline.txt)
        if [[ "$cmdline" != *"cgroup_enable=cpuset"* ]]; then
            sed -i 's/$/ cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1/' /boot/firmware/cmdline.txt
            echo "updated"
        fi
      register: cgroup_update
      changed_when: "'updated' in cgroup_update.stdout"

    - name: Optimize Hardware (Disable WiFi/BT/GPU)
      blockinfile:
        path: /boot/firmware/config.txt
        block: |
          gpu_mem={{ gpu_mem }}
          dtoverlay=disable-bt
          dtoverlay=disable-wifi

    # --- CONTAINER RUNTIME ---
    - name: Install Containerd
      apt:
        name: containerd
        state: present

    - name: Generate default containerd config
      shell: |
        mkdir -p /etc/containerd
        containerd config default > /etc/containerd/config.toml

    - name: Configure SystemdCgroup
      replace:
        path: /etc/containerd/config.toml
        regexp: 'SystemdCgroup = false'
        replace: 'SystemdCgroup = true'

    - name: Restart Containerd
      service:
        name: containerd
        state: restarted
        enabled: yes

    # --- REBOOT HANDLER ---
    - name: Reboot Node
      reboot:
        msg: "Rebooting for Kernel/Cgroup changes"
        post_reboot_delay: 30
      when: cgroup_update.changed or apt_action.changed
