---
# =============================================================================
# Phase 1 - OS Preparation & Tuning
# =============================================================================
# Prepares Raspberry Pi nodes for Kubernetes by:
#   - Installing required packages and dependencies
#   - Disabling swap (Kubernetes requirement)
#   - Loading kernel modules for networking and storage
#   - Enabling cgroups for resource management
#   - Optimizing hardware (disable WiFi/BT, reduce GPU memory)
#   - Installing and configuring containerd runtime
#
# Usage: ansible-playbook -i hosts playbooks/01_node_prep.yml
# Tags:  packages, swap, kernel, cgroups, hardware, containerd
# =============================================================================

- name: Phase 1 - OS Preparation & Tuning
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Raspberry Pi GPU memory allocation (MB) - minimum for headless
    gpu_mem: 16
    # Containerd pause image for Kubernetes
    sandbox_image: "registry.k8s.io/pause:3.10"
    # Suppress needrestart interactive prompts
    env_vars:
      DEBIAN_FRONTEND: noninteractive
      NEEDRESTART_MODE: automatic

  # =========================================================================
  # HANDLERS - Triggered by notify, run once at end
  # =========================================================================
  handlers:
    - name: Restart containerd
      ansible.builtin.service:
        name: containerd
        state: restarted

    - name: Apply sysctl
      ansible.builtin.command: sysctl --system
      changed_when: true

    - name: Reboot required
      ansible.builtin.reboot:
        msg: "Rebooting for kernel/cgroup changes"
        connect_timeout: 5
        reboot_timeout: 300
        pre_reboot_delay: 0
        post_reboot_delay: 30
        test_command: uptime

  # =========================================================================
  # TASKS
  # =========================================================================
  tasks:
    # -----------------------------------------------------------------------
    # PRE-FLIGHT CHECKS & CLEANUP
    # -----------------------------------------------------------------------
    - name: Verify we're running on ARM64
      ansible.builtin.assert:
        that:
          - ansible_architecture == "aarch64"
        fail_msg: "This playbook is designed for ARM64 (Raspberry Pi). Detected: {{ ansible_architecture }}"
      tags: [preflight]

    - name: Wait for automatic system updates to complete (Release APT Lock)
      ansible.builtin.shell: |
        while fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1; do sleep 5; done;
      changed_when: false
      tags: [preflight]

    # -----------------------------------------------------------------------
    # SYSTEM UPDATES & DEPENDENCIES
    # -----------------------------------------------------------------------
    - name: Update apt cache and upgrade packages
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600
        lock_timeout: 300
      environment: "{{ env_vars }}"
      tags: [packages]

    - name: Install Kubernetes dependencies
      ansible.builtin.apt:
        name:
          # Core utilities
          - apt-transport-https
          - ca-certificates
          - curl
          - gnupg
          - lsb-release
          - software-properties-common
          # Storage (Longhorn requirements)
          - open-iscsi
          - nfs-common
          - cryptsetup
          # Networking (Cilium/Kubeadm requirements)
          - ipset
          - ipvsadm
          - conntrack
          - ethtool
          # Utilities
          - socat
          - git
          - jq
          - htop
          - iotop
        state: present
        lock_timeout: 300
      environment: "{{ env_vars }}"
      tags: [packages]

    - name: Enable iscsid service for Longhorn
      ansible.builtin.service:
        name: iscsid
        state: started
        enabled: true
      tags: [packages]

    # -----------------------------------------------------------------------
    # SWAP CONFIGURATION
    # -----------------------------------------------------------------------
    - name: Disable swap immediately
      ansible.builtin.command: swapoff -a
      changed_when: false
      when: ansible_swaptotal_mb > 0
      tags: [swap]

    - name: Remove swap entry from fstab
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^([^#].*?\sswap\s+.*)$'
        replace: '# \1 # Disabled for Kubernetes'
      tags: [swap]

    - name: Disable swap target
      ansible.builtin.systemd:
        name: swap.target
        state: stopped
        enabled: false
        masked: true
      tags: [swap]

    # -----------------------------------------------------------------------
    # KERNEL MODULES
    # -----------------------------------------------------------------------
    - name: Configure persistent kernel modules
      ansible.builtin.copy:
        dest: /etc/modules-load.d/k8s.conf
        content: |
          # Kubernetes required kernel modules
          overlay
          br_netfilter
          # Longhorn iSCSI support
          iscsi_tcp
          # IPVS for kube-proxy (optional, better performance)
          ip_vs
          ip_vs_rr
          ip_vs_wrr
          ip_vs_sh
          nf_conntrack
        mode: '0644'
      tags: [kernel]

    - name: Load kernel modules immediately
      community.general.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
        - iscsi_tcp
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh
        - nf_conntrack
      tags: [kernel]

    # -----------------------------------------------------------------------
    # SYSCTL NETWORK TUNING
    # -----------------------------------------------------------------------
    - name: Configure sysctl for Kubernetes networking
      ansible.builtin.copy:
        dest: /etc/sysctl.d/99-kubernetes.conf
        content: |
          # Kubernetes networking requirements
          net.bridge.bridge-nf-call-iptables  = 1
          net.bridge.bridge-nf-call-ip6tables = 1
          net.ipv4.ip_forward                 = 1
          net.ipv6.conf.all.forwarding        = 1

          # Performance tuning for containers
          net.core.somaxconn                  = 32768
          net.ipv4.tcp_max_syn_backlog        = 32768
          net.core.netdev_max_backlog         = 32768

          # Increase inotify limits (for many pods)
          fs.inotify.max_user_watches         = 524288
          fs.inotify.max_user_instances       = 8192

          # File descriptor limits
          fs.file-max                         = 2097152
        mode: '0644'
      notify: Apply sysctl
      tags: [kernel]

    # -----------------------------------------------------------------------
    # RASPBERRY PI SPECIFIC - CGROUPS
    # -----------------------------------------------------------------------
    # Note: RPi firmware can have multiple cmdline files depending on os_prefix
    # in config.txt. We need to check and fix ALL of them.
    
    - name: Find all cmdline.txt files
      ansible.builtin.find:
        paths:
          - /boot/firmware
          - /boot/firmware/current
          - /boot/firmware/new
        patterns: "cmdline.txt"
        file_type: file
      register: cmdline_files
      tags: [cgroups]

    - name: Remove cgroup_disable=memory from all cmdline files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: 'cgroup_disable=memory\s*'
        replace: ''
      loop: "{{ cmdline_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Reboot required
      tags: [cgroups]

    - name: Ensure cgroups enabled in all cmdline files
      ansible.builtin.replace:
        path: "{{ item.path }}"
        regexp: '(^.+rootwait)(?!.*cgroup_enable=cpuset)(.*)$'
        replace: '\1 cgroup_enable=cpuset cgroup_enable=memory cgroup_memory=1\2'
      loop: "{{ cmdline_files.files }}"
      loop_control:
        label: "{{ item.path }}"
      notify: Reboot required
      tags: [cgroups]

    - name: Verify no cgroup_disable=memory in any cmdline file
      ansible.builtin.shell: |
        grep -l "cgroup_disable=memory" /boot/firmware/cmdline.txt /boot/firmware/*/cmdline.txt 2>/dev/null || echo "CLEAN"
      register: cgroup_disable_check
      changed_when: false
      failed_when: cgroup_disable_check.stdout != "CLEAN"
      tags: [cgroups]

    # -----------------------------------------------------------------------
    # RASPBERRY PI SPECIFIC - HARDWARE OPTIMIZATION
    # -----------------------------------------------------------------------
    - name: Configure Raspberry Pi hardware optimizations
      ansible.builtin.blockinfile:
        path: /boot/firmware/config.txt
        marker: "# {mark} KUBERNETES OPTIMIZATIONS"
        block: |
          # Reduce GPU memory (headless server)
          gpu_mem={{ gpu_mem }}

          # Disable unused hardware to save power/memory
          dtoverlay=disable-bt
          dtoverlay=disable-wifi

          # Disable audio (saves resources)
          dtparam=audio=off

          # Enable hardware watchdog
          dtparam=watchdog=on

          # Optimize for server workload
          arm_boost=1
      notify: Reboot required
      tags: [hardware]

    # -----------------------------------------------------------------------
    # CONTAINER RUNTIME - CONTAINERD
    # -----------------------------------------------------------------------
    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        lock_timeout: 300
      environment: "{{ env_vars }}"
      tags: [containerd]

    - name: Create containerd config directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        mode: '0755'
      tags: [containerd]

    - name: Check if containerd config exists
      ansible.builtin.stat:
        path: /etc/containerd/config.toml
      register: containerd_config
      tags: [containerd]

    - name: Generate containerd default config
      ansible.builtin.shell: |
        containerd config default > /etc/containerd/config.toml
      when: not containerd_config.stat.exists
      notify: Restart containerd
      tags: [containerd]

    - name: Configure containerd (SystemdCgroup) - handle various formats
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '(\s*SystemdCgroup\s*=\s*)false'
        replace: '\1true'
      notify: Restart containerd
      tags: [containerd]

    - name: Ensure SystemdCgroup is present in runc options
      ansible.builtin.lineinfile:
        path: /etc/containerd/config.toml
        regexp: '^\s*SystemdCgroup\s*='
        line: '            SystemdCgroup = true'
        insertafter: '\[plugins\."io\.containerd\.grpc\.v1\.cri"\.containerd\.runtimes\.runc\.options\]'
        state: present
      notify: Restart containerd
      tags: [containerd]

    - name: Verify SystemdCgroup is set to true
      ansible.builtin.shell: |
        grep -E "^\s*SystemdCgroup\s*=\s*true" /etc/containerd/config.toml && echo "OK" || echo "MISSING"
      register: systemd_cgroup_check
      changed_when: false
      failed_when: systemd_cgroup_check.stdout != "OK"
      tags: [containerd]

    - name: Configure containerd (Sandbox Image)
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: 'sandbox_image = ".*"'
        replace: 'sandbox_image = "{{ sandbox_image }}"'
      notify: Restart containerd
      tags: [containerd]

    - name: Enable and start containerd
      ansible.builtin.service:
        name: containerd
        state: started
        enabled: true
      tags: [containerd]

    # -----------------------------------------------------------------------
    # FINAL VALIDATION
    # -----------------------------------------------------------------------
    - name: Verify swap is disabled
      ansible.builtin.command: swapon --show
      register: swap_check
      changed_when: false
      failed_when: swap_check.stdout != ""
      tags: [validate]

    - name: Verify required kernel modules
      ansible.builtin.shell: |
        lsmod | grep -E "^(overlay|br_netfilter|iscsi_tcp)" | wc -l
      register: modules_check
      changed_when: false
      failed_when: modules_check.stdout | int < 3
      tags: [validate]

    - name: Verify containerd is running
      ansible.builtin.command: systemctl is-active containerd
      register: containerd_check
      changed_when: false
      failed_when: containerd_check.stdout != "active"
      tags: [validate]

    - name: Verify cgroups enabled (CMDLINE files)
      ansible.builtin.shell: |
        # Check all cmdline files for proper configuration
        for f in /boot/firmware/cmdline.txt /boot/firmware/*/cmdline.txt; do
          if [ -f "$f" ]; then
            if grep -q "cgroup_disable=memory" "$f"; then
              echo "FAIL: cgroup_disable=memory found in $f"
              exit 1
            fi
            if ! grep -q "cgroup_enable=cpuset" "$f"; then
              echo "FAIL: cgroup_enable=cpuset missing in $f"
              exit 1
            fi
          fi
        done
        echo "OK"
      register: cmdline_check
      changed_when: false
      failed_when: cmdline_check.rc != 0
      tags: [validate]

    - name: Check if reboot needed for cgroups
      ansible.builtin.shell: |
        # Check both that cgroup_enable is active AND cgroup_disable=memory is NOT present
        if grep -q "cgroup_enable=cpuset" /proc/cmdline && ! grep -q "cgroup_disable=memory" /proc/cmdline; then
          echo "active"
        else
          echo "pending"
        fi
      register: cgroup_runtime
      changed_when: false
      tags: [validate]

    - name: Verify cgroups v2 memory controller (runtime)
      ansible.builtin.shell: |
        cat /sys/fs/cgroup/cgroup.controllers | grep -q memory && echo "enabled" || echo "disabled"
      register: cgroup_memory_check
      changed_when: false
      failed_when: false
      tags: [validate]

    - name: Display completion message
      ansible.builtin.debug:
        msg: |
          ════════════════════════════════════════════════════════════════
          ✅ Node preparation complete: {{ inventory_hostname }}
          ════════════════════════════════════════════════════════════════
          • Packages installed
          • Swap disabled
          • Kernel modules loaded
          • Sysctl tuned for Kubernetes
          • Containerd configured with SystemdCgroup
          {% if cgroup_runtime.stdout == "pending" %}
          ⚠️  REBOOT REQUIRED - cgroups changes pending!
          {% endif %}
          {% if cgroup_memory_check.stdout == "disabled" %}
          ⚠️  Memory cgroup not active - reboot required!
          {% else %}
          • Cgroups v2 memory controller: ACTIVE
          {% endif %}
      tags: [validate]